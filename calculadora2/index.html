<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>

<body>
    <div class="calculadora">
        <label>Dia</label>
        <input type="number" id="dia" min="1" max="31">
        <label>Mês</label>
        <select id="mes" name="cidade">
            <option value="1">Janeiro</option>
            <option value="2">Fevereiro</option>
            <option value="3">Março</option>
            <option value="4">Abril</option>
            <option value="5">Maio</option>
            <option value="6">Junho</option>
            <option value="7">Julho</option>
            <option value="8">Agosto</option>
            <option value="9">Setembro</option>
            <option value="10">Outubro</option>
            <option value="11">Novembro</option>
            <option value="12">Dezembro</option>
        </select>
        <label>Ano</label>
        <input type="number" id="ano" min="1900" max="2026" value="2026">
        <br>
        <button onclick="calcular()">Calcular</button>
        <br>

        <h1 id="resultado">Você tem ??? anos</h1>
        <p id="obs">Obs: se você mentir sua data de nascimento, eu vou mentir sua idade</p>

        <script src="calculadora.js"></script>
    </div>
</body>

</html>
